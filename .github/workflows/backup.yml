name: Database Backup (Disaster Recovery)

on:
  schedule:
    # Se ejecuta automáticamente todos los domingos a las 3:00 AM UTC
    - cron: "0 3 * * 0"
  # Esta opción te permite hacer clic en un botón en GitHub para ejecutarlo manualmente cuando quieras
  workflow_dispatch:

jobs:
  backup:
    name: 💾 Respaldo Automático de Supabase
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Instalar herramientas de PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: 📦 Extraer y Comprimir Base de Datos
        env:
          # Esta variable vendrá de los secretos de GitHub para no exponerla
          PROD_DB_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DB_URL" ]; then
            echo "❌ ERROR: El secreto PROD_DATABASE_URL no está configurado."
            exit 1
          fi

          echo "Iniciando respaldo de la base de datos de producción..."

          # Generamos un nombre de archivo con la fecha actual (ej. backup_2026-08-16.sql.gz)
          FILENAME="backup_$(date +'%Y-%m-%d').sql.gz"

          # Extraemos toda la estructura y datos, y la comprimimos al vuelo
          pg_dump "$PROD_DB_URL" | gzip > $FILENAME

          echo "✅ Respaldo extraído y comprimido con éxito: $FILENAME"

          # Guardamos el nombre del archivo para que el siguiente paso lo encuentre
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV

      - name: ☁️ Subir Respaldo a GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alabanza-db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90 # El límite máximo de almacenamiento gratuito
