name: CI/CD - Validacion Estricta y Despliegue Seguro

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # =========================================================================
  # JOB 1: ADUANA DE PRUEBAS Y COBERTURA (Se ejecuta siempre primero)
  # =========================================================================
  test-backend:
    name: 🧪 Pruebas y Cobertura (Backend)
    runs-on: ubuntu-latest

    # 1. Levantamos la base de datos PostgreSQL efímera para las pruebas
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpassword
          POSTGRES_DB: alabanza_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: 📥 Clonar el código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🗄️ Estructurar Base de Datos de Prueba
        env:
          PGPASSWORD: adminpassword
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U admin -d alabanza_db_test -f ${{ github.workspace }}/database/init.sql

      - name: 🧪 Ejecutar Pruebas y Validar Cobertura (>80%)
        env:
          DATABASE_URL: postgresql://admin:adminpassword@localhost:5432/alabanza_db_test
          JWT_SECRET: super_secreto_alabanza_2026_desarrollo
          NODE_ENV: test
        run: npm run test:coverage

  # =========================================================================
  # JOB 2: DESPLIEGUE CONTROLADO (Solo corre si JOB 1 pasa en verde al 100%)
  # =========================================================================
  deploy-production:
    name: 🚀 Desplegar a Producción (Render & Vercel)
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 🌐 Disparar Despliegue en Render (Backend)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_HOOK"
          echo "Despliegue del backend enviado a Render correctamente."

      - name: 🌐 Disparar Despliegue en Vercel (Frontend)
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$VERCEL_HOOK"
          echo "Despliegue del frontend enviado a Vercel correctamente."
